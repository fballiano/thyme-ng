name: ThymeNG
options:
  bundleIdPrefix: com.fabrizioballiano
  # An Icon Composer document is a folder. Without this XcodeGen adds the files
  # inside it one by one, and the icon never reaches actool.
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The compiler writes the text of every localizable literal into
    # .stringsdata. Xcode reads those files, so the String Catalog editor
    # shows a new string as soon as the code adds one.
    SWIFT_EMIT_LOC_STRINGS: YES
    # Universal binary: Apple silicon and Intel.
    ARCHS: $(ARCHS_STANDARD)
    VALID_ARCHS: arm64 x86_64
    # The release workflow writes this line after each release.
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  ThymeNG:
    type: application
    platform: macOS
    sources:
      - path: Sources/ThymeNG
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: thyme-ng
        CFBundleName: thyme-ng
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: thyme-ng.sdef
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: >-
          Copyright © 2026 Fabrizio Balliano. MIT licensed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.thyme-ng
        PRODUCT_NAME: thyme-ng
        PRODUCT_MODULE_NAME: ThymeNG
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  ThymeNGTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ThymeNGTests
    dependencies:
      - target: ThymeNG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.thyme-ng-tests
        PRODUCT_MODULE_NAME: ThymeNGTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/thyme-ng.app/Contents/MacOS/thyme-ng"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ThymeNG:
    build:
      targets:
        ThymeNG: all
        ThymeNGTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThymeNGTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
